<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submission Error | Nature Care</title>
<style>
    :root {
        --primary-green: #27AE46;
        --dark-charcoal: #2F3542;
        --grey: #6B7280;
        --light-grey: #F5F7FA;
        --white: #FFFFFF;
        --error-red: #E74C3C;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Roboto', 'Open Sans', sans-serif;
        background: linear-gradient(135deg, var(--dark-charcoal) 0%, #1c2026 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        background: var(--white);
        border-radius: 16px;
        padding: 60px 50px;
        max-width: 480px;
        width: 90%;
        text-align: center;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }

    @keyframes cardIn {
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .icon-wrapper {
        width: 110px;
        height: 110px;
        margin: 0 auto 30px;
        position: relative;
    }

    .icon-circle {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: var(--error-red);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: shakeIn 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) 0.2s forwards;
        opacity: 0;
        transform: scale(0.5);
    }

    @keyframes shakeIn {
        0% { opacity: 0; transform: scale(0.5); }
        60% { opacity: 1; transform: scale(1.05) rotate(3deg); }
        80% { transform: scale(1) rotate(-2deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .icon-circle svg {
        width: 50px;
        height: 50px;
    }

    .icon-circle path, .icon-circle line {
        stroke: var(--white);
        stroke-width: 4;
        stroke-linecap: round;
    }

    h1 {
        color: var(--dark-charcoal);
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 14px;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: fadeUp 0.6s ease-out 0.5s forwards;
    }

    p {
        color: var(--grey);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
        opacity: 0;
        animation: fadeUp 0.6s ease-out 0.65s forwards;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        animation: fadeUp 0.6s ease-out 0.8s forwards;
    }

    .btn {
        display: inline-block;
        text-decoration: none;
        font-weight: 700;
        padding: 14px 28px;
        border-radius: 6px;
        font-size: 15px;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-primary {
        background: var(--primary-green);
        color: var(--white);
    }

    .btn-primary:hover {
        background: var(--dark-charcoal);
        transform: translateY(-2px);
    }

    .btn-secondary {
        background: var(--light-grey);
        color: var(--dark-charcoal);
    }

    .btn-secondary:hover {
        background: #E1E5EB;
        transform: translateY(-2px);
    }
</style>
</head>
<body>

<div class="card">
    <div class="icon-wrapper">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </div>
    </div>
    <h1>Something Went Wrong</h1>
    <p>We weren't able to send your assessment request just now. Please try again in a moment, or reach out to us directly.</p>
    <div class="btn-group">
        <a href="/index.html#assessment" class="btn btn-primary">Try Again</a>
        <a href="/index.html" class="btn btn-secondary">Home Page</a>
    </div>
</div>

</body>
</html>
